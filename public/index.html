<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <title>Weni Widget</title>
</head>

<body>

    <script>
        const params = new URLSearchParams(window.location.search);
        const channelUuid = params.get('channelUuid');
        (function (d, s, u) {
            let h = d.getElementsByTagName(s)[0], k = d.createElement(s);
            k.onload = function () {
                let l = d.createElement(s); l.src = u; l.async = true;
                h.parentNode.insertBefore(l, k.nextSibling);
            };
            k.async = true;
            k.src = 'https://storage.googleapis.com/push-webchat/wwc-latest.js';
            h.parentNode.insertBefore(k, h);
        })(document, 'script', `https://weni-sp-integrations-production.s3.amazonaws.com/apptypes/wwc/${channelUuid}/script.js`);
    </script>
</body>

</html>
